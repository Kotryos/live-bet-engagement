name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Covers Avro codegen, compilation, the five topology tests and the fat
      # jar. The tests need no Kafka, so this runs without any services.
      - run: ./gradlew :app:build
